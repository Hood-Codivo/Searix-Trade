<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="gradA" x1="0" x2="1">
      <stop offset="0%" stop-color="#0ff2c2"/>
      <stop offset="50%" stop-color="#4cc7ff"/>
      <stop offset="100%" stop-color="#7a5bff"/>
    </linearGradient>
  </defs>

  <!-- Hexagon container -->
  <g transform="translate(300,300)">
    <path d="M0 -220 L190 -110 L190 110 L0 220 L-190 110 L-190 -110 Z" fill="url(#gradA)" stroke="#0b1020" stroke-width="6"/>

    <!-- Stylized S as simple geometric slabs for clarity -->
    <g transform="translate(-30,-10) scale(1.2)">
      <rect x="-90" y="-120" width="180" height="60" rx="18" fill="#071127"/>
      <rect x="-30" y="-30" width="120" height="60" rx="18" fill="#071127"/>
      <rect x="-90" y="60" width="180" height="60" rx="18" fill="#071127"/>
    </g>
  </g>

  <!-- Wordmark below -->
  <text x="300" y="540" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="48" fill="#0b1020">Searix <tspan fill="#162038">Trade</tspan></text>
</svg>